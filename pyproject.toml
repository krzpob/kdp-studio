[project]
name = "kdp-studio"
version = "0.1.0"
description = "Generator kolorowanek pod Amazon KDP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.51.0",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "typer>=0.29",
]

[project.scripts]
kdp-studio = "kdp_studio.cli:run"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kdp_studio"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Polskie komunikaty celowo używają półpauzy (1–200) i znaku mnożenia (10 × 2).
allowed-confusables = ["–", "×"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
