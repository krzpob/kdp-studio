# Profile formatu strony (spec §7.3, decyzja D7).
#
# Klucz profilu = wartość parametru --format.
#   name, description – wyświetlane przez `kdp-studio profiles format` (FR-12)
#   trim_in          – wymiar strony po przycięciu [szer., wys.] w calach
#   dpi              – rozdzielczość druku
#   page_px          – wymiar wyjściowego page_XX.png [szer., wys.] = trim_in × dpi (NFR-07)
#   aspect           – proporcja przekazywana adapterowi ImageProvider (FR-05)
#   safe_margin_in   – nasz minimalny margines (wygoda kolorowania); musi być ≥ kdp_margins.outside_min_in
#   composition_hint – fragment promptu obrazu (FR-04), po angielsku
#
# Margines przy grzbiecie zależy od liczby stron książki, nie od formatu, więc jest w
# settings.yaml (kdp_margins, spec §7.4). Strona ma margines symetryczny (FR-06):
#   margin_in = max(safe_margin_in, outside_min_in, gutter_in(pages_in_book))
#
# Bez spadu (bleed): grafika zawsze mieści się w obszarze treści na białym tle.

letter:            # 8.5" × 11", pion
  name: Letter (8.5" × 11")
  description: Pionowa strona, postać lub scena w pionie.
  trim_in: [8.5, 11]
  dpi: 300
  page_px: [2550, 3300]
  aspect: "3:4"
  safe_margin_in: 0.5     # nasz minimalny margines (wygoda kolorowania); KDP wymaga ≥ 0.25"
  composition_hint: "vertical composition, subject fills most of the portrait frame, main subject fully inside the image, not cut off by the edges"

square:            # 8.5" × 8.5"
  name: Square (8.5" × 8.5")
  description: Kwadratowa strona, centralny obiekt lub kompozycja koncentryczna.
  trim_in: [8.5, 8.5]
  dpi: 300
  page_px: [2550, 2550]
  aspect: "1:1"
  safe_margin_in: 0.5
  composition_hint: "centered composition, single focal subject or concentric design, main subject fully inside the image, not cut off by the edges"
