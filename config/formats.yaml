# Profile formatu strony (spec §7.3, decyzja D7).
#
# Klucz profilu = wartość parametru --format.
#   name, description – wyświetlane przez `kdp-studio profiles format` (FR-12)
#   trim_in          – wymiar strony po przycięciu [szer., wys.] w calach
#   dpi              – rozdzielczość druku
#   page_px          – wymiar wyjściowego page_XX.png [szer., wys.] = trim_in × dpi (NFR-07)
#   aspect           – proporcja przekazywana adapterowi ImageProvider (FR-05)
#   safe_margin_in   – margines bezpieczny; min. KDP bez spadu to 0.25" na zewnątrz
#   gutter_in        – margines wewnętrzny (grzbiet) dla 24–150 stron
#   composition_hint – fragment promptu obrazu (FR-04), po angielsku
#
# Bez spadu (bleed): grafika zawsze mieści się w obszarze bezpiecznym na białym tle.

letter:            # 8.5" × 11", pion
  name: Letter (8.5" × 11")
  description: Pionowa strona, postać lub scena w pionie.
  trim_in: [8.5, 11]
  dpi: 300
  page_px: [2550, 3300]
  aspect: "3:4"
  safe_margin_in: 0.5     # min. KDP bez spadu: 0.25" na zewnątrz
  gutter_in: 0.375        # margines wewnętrzny (grzbiet), 24–150 stron
  composition_hint: "vertical composition, subject fills the portrait frame"

square:            # 8.5" × 8.5"
  name: Square (8.5" × 8.5")
  description: Kwadratowa strona, centralny obiekt lub kompozycja koncentryczna.
  trim_in: [8.5, 8.5]
  dpi: 300
  page_px: [2550, 2550]
  aspect: "1:1"
  safe_margin_in: 0.5
  gutter_in: 0.375
  composition_hint: "centered composition, single focal subject or concentric design"
