# Rynki Amazona (FR-19): jedno źródło danych o rynku książki.
#
# Klucz rynku = wartość parametru --market (ideas, generate); domyślny: default_market w
# settings.yaml. Książka powstaje dla jednego rynku, bo tytuł w KDP ma jeden język i jeden zestaw
# metadanych. Ta sama kolorowanka w innej odmianie języka to w KDP osobna książka.
#
# Dla każdego rynku:
#   name, domain, locale  – nazwa do `kdp-studio profiles market`, domena Amazona, kod języka
#   language              – odmiana języka do promptu metadanych (FR-03), po angielsku
#   currency, printing_cost, royalty – dane cenowe FR-16; rynki o wspólnych tabelach KDP wskazują
#                           grupę (pricing_group), żeby nie powielać liczb
#   terms                 – stałe teksty, które wpisuje program (nie model, bo bez literówek):
#     coloring_book       – nazwa gatunku w podtytule (FR-03, FR-15)
#     belongs_to          – napis strony „This book belongs to…” (FR-14), chyba że
#                           belongs_to_page.text w settings.yaml jest ustawione ręcznie
#     ages                – wzór wieku dzieci ({min} i {max} z age_range profilu wieku)
#     adults              – zamiast wzoru wieku dla profilu bez age_range (dorośli)
#   spelling              – słowa innej odmiany języka → pisownia rynku (np. color → colour na
#                           rynku brytyjskim); program poprawia nimi metadane po wygenerowaniu (FR-03a)
#   alphabet              – znaki języka spoza podstawowego ASCII; czcionki napisów (FR-14,
#                           FR-15) muszą je mieć, zanim program wyda pieniądze na API
#   font                  – czcionka napisów programu na tym rynku (strona FR-14, tytuł okładki),
#                           zamiast belongs_to_page.font i cover.title_font; warianty grubości
#                           (font_variation, title_font_variation) zostają z settings.yaml.
#                           Fredoka (US, UK) nie ma polskich liter, więc pozostałe rynki dostają
#                           Baloo 2; japońskich znaków nie ma żadna z nich (JP bez FR-14 i okładki)
#
# Ceny: paperback, czarny atrament, papier biały, z dwóch stron pomocy KDP (sources). Koszt druku
# to koszt stały do fixed_only_max_pages stron, potem fixed + strony × per_page. Format jest duży
# (large), gdy ma ponad 6.12" szerokości albo ponad 9" wysokości (oba nasze formaty są duże).
# Stawka tantiemy: 50% do rate_50_max_price włącznie, 60% od rate_60_min_price. Przed publikacją
# sprawdź liczby w kalkulatorze KDP; przy dodawaniu rynku sprawdź też, czy KDP przyjmuje
# paperbacki w jego języku.

sources:
  printing_cost: https://kdp.amazon.com/en_US/help/topic/G201834340
  royalty: https://kdp.amazon.com/en_US/help/topic/G201834330
  calculator: https://kdp.amazon.com/en_US/royalty-calculator
checked: 2026-11-18
large_trim: {width_over_in: 6.12, height_over_in: 9.0}

pricing_groups:
  EU:                              # Amazon.de, .fr, .es, .it, .nl, .ie, .com.be: wspólne tabele KDP
    currency: EUR
    printing_cost:
      fixed_only_max_pages: 110
      regular: {fixed_only: 2.05, fixed: 0.75, per_page: 0.012}
      large: {fixed_only: 2.48, fixed: 0.75, per_page: 0.016}
    royalty: {rate_50_max_price: 9.98, rate_60_min_price: 9.99, max_price: 250}

markets:
  US:
    name: Amazon.com (USA)
    domain: amazon.com
    locale: en-US
    language: American English
    currency: USD
    printing_cost:
      fixed_only_max_pages: 110
      regular: {fixed_only: 2.30, fixed: 1.00, per_page: 0.012}
      large: {fixed_only: 2.84, fixed: 1.00, per_page: 0.017}
    royalty: {rate_50_max_price: 9.98, rate_60_min_price: 9.99, max_price: 250}
    terms:
      coloring_book: Coloring Book
      belongs_to: "This book belongs to:"
      ages: "for Kids Ages {min}–{max}"
      adults: for Adults
    spelling:                      # pisownia rynku: słowo innej odmiany → poprawne
      colour: color
      colours: colors
      coloured: colored
      colouring: coloring
      favourite: favorite
      favourites: favorites

