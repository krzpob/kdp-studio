# Ustawienia domyślne (spec §9.2). Flagi CLI nadpisują te wartości.
# Kolejne klucze (np. cenniki) dochodzą razem z wymaganiami, które ich używają.

# Strony wstępne (FR-23), przed kolorowankami: [1] strona 1, [2] prawa autorskie, a z instrukcją
# także [3] instrukcja i [4] pusta strona, więc 4 strony wstępne zamiast 2 (FR-02 liczy z nich
# pages_in_book). Strona 1 to tytułowa do kolorowania (title) albo „This book belongs to…”
# (belongs-to, FR-14). Strony z modelem obrazu (strona 1, ilustracja instrukcji) robi polecenie
# front-matter albo krok generate (in_generate); bez niego finalize robi stronę 1 z samym
# tytułem. Prawa autorskie i teksty instrukcji: texts w config/markets.yaml według języka rynku.
front_matter:
  first_page: belongs-to        # --first-page title|belongs-to
  instructions: true            # --instructions/--no-instructions
  copyright: short              # --copyright minimal|short|full
  in_generate: true             # generate --front-matter/--no-front-matter
  text_font: assets/fonts/NotoSans-Variable.ttf   # zwykły tekst stron wstępnych (OFL)
  text_font_variation: Regular
  text_bold_variation: Bold
  copyright_pt: 12              # blok praw autorskich nad dolnym marginesem; za długi tekst program
  copyright_min_pt: 9           # zmniejsza najwyżej do copyright_min_pt, potem błąd (kod 1)

# Wnętrze książki (FR-22). Druk jednostronny (D8): każda grafika na stronie nieparzystej
# (prawej) z pustym tyłem, bo kredki i flamastry przebijają; dwustronny: grafiki jedna po
# drugiej. Wartość należy do książki (manifest input.single_sided), finalize może ją zmienić.
# finalize składa interior.pdf (strony wstępne FR-23, grafiki, puste strony), gdy wszystkie
# strony są gotowe; pdf: false go wyłącza.
interior:
  single_sided: true            # --single-sided/--double-sided w ideas, generate i finalize
  pdf: true

# Właściciel praw autorskich ({owner} na stronie praw, FR-23): pseudonim, imię i nazwisko albo
# firma; --copyright-owner w ideas i generate nadpisuje. Bez niego nowa książka nie powstanie.
publisher:
  copyright_owner: null

# Strona 1 do kolorowania z tytułem książki (FR-23, --first-page title). Model rysuje scenę z pustym
# górnym pasem (text_box, ułamki obszaru treści), program wpisuje tytuł konturowymi literami
# czcionką napisów rynku. Pas z tuszem powyżej max_ink_ratio to ponowienie; po max_retries układ
# zapasowy: tytuł u góry i grafika pierwszej gotowej strony pod nim.
title_page:
  composition: >-
    a cheerful scene with the main characters and objects of the book in the lower two thirds of
    the page; the top third of the page is completely empty white space with nothing drawn in it
  text_box: {x: 0.04, y: 0.0, width: 0.92, height: 0.3}
  max_ink_ratio: 0.005
  max_retries: 2
  font_variation: Bold
  font_pt: 54

# Strona 3 z instrukcją (FR-23). Teksty wpisuje program (nagłówek czcionką napisów rynku, reszta
# front_matter.text_font), a pod nimi (art_box) jest ilustracja z modelu z główną postacią książki
# ({subject}). Po max_retries nieudanych próbach: grafika zapasowa bez postaci (fallback_art, SVG).
instructions:
  composition: >-
    {subject} slips a blank sheet of thick paper behind a page of an open coloring book lying on
    a table, two big curved arrows show how the sheet slides under the page
  art_box: {x: 0.0, y: 0.45, width: 1.0, height: 0.55}
  max_retries: 2
  heading_pt: 30
  section_pt: 16
  body_pt: 13
  heading_variation: Bold
  fallback_art: assets/front_matter/instructions.svg

# Strona „This book belongs to…” (FR-14), strona 1 przy front_matter.first_page: belongs-to.
# Model obrazu rysuje tylko ramkę z motywem książki wokół pustej tabliczki, a napis i linię na
# imię wpisuje program czcionką z assets/fonts (SIL OFL). Gdy pole na tekst (text_box, ułamki
# obszaru treści) ma więcej tuszu niż max_ink_ratio, strona jest generowana ponownie, najwyżej
# max_retries razy; potem układ zapasowy: grafika pierwszej strony książki w górnej części
# (fallback_art_height) i napis pod nią.
belongs_to_page:
  text: null                  # null: napis z markets.yaml (terms.belongs_to rynku książki, FR-19)
  composition: >-
    a decorative frame made of theme elements around a large empty blank plaque in the center
    of the page, the plaque is completely empty with nothing written or drawn inside it
  text_box: {x: 0.2, y: 0.37, width: 0.6, height: 0.3}
  max_ink_ratio: 0.005
  max_retries: 2
  font: assets/fonts/Fredoka-Variable.ttf
  font_variation: SemiBold
  fallback_art_height: 0.55

# Zapas pomysłów na strony odrzucone przez QA: pages + ceil(pages * reserve_ratio) (FR-03).
reserve_ratio: 0.2

# Weryfikacja pomysłów przed generowaniem grafik (FR-03a): osobne wywołanie modelu tekstowego
# ocenia każdy pomysł, poprawia albo odrzuca te niepasujące do tematu, a zapas je zastępuje.
# Kosztuje ułamek centa na książkę, mniej niż jedna wyrzucona grafika. --no-review-ideas wyłącza.
review_ideas: true

# Różnorodność pomysłów (FR-03b): najwyższy udział stron książki z tą samą czynnością postaci,
# tym samym miejscem akcji i tym samym przedmiotem w scenie (0–1]. Minimalny udział scen z kilkoma
# postaciami jest w profilu wieku (multi_subject_share). Przy weryfikacji pomysłów program
# wyrównuje rozkład zamianą z zapasem, a potem poprawkami LLM; reszta problemów to ostrzeżenia.
diversity:
  max_action_share: 0.3
  max_setting_share: 0.3
  max_element_share: 0.35

# Kontrola jakości grafik modelem z wizją (FR-07): --qa / --no-qa nadpisuje. Strona odrzucona
# przez QA (wada albo temat niewidoczny w samym rysunku) jest generowana ponownie z tego samego
# pomysłu, najwyżej qa_max_retries razy (0–5). Gdy to nie pomoże, bierze zapasowy pomysł; łącznie
# najwyżej qa_max_ideas pomysłów na stronę (1–5, 1: bez zapasowych). Najgorszy przypadek to
# qa_max_ideas × (1 + qa_max_retries) grafik na stronę.
qa: false
qa_max_retries: 2
qa_max_ideas: 2

# Rynek Amazona książki (FR-19): klucz z config/markets.yaml; --market w ideas i generate nadpisuje.
# Od rynku zależą odmiana języka metadanych (tytuł, opis, słowa kluczowe), stałe napisy programu
# i dane cenowe (FR-16). Prompty obrazów i opisy scen zostają po angielsku.
default_market: US

# Implementacje z rejestru src/kdp_studio/providers/registry.py.
providers:
  text: openai
  image: openai   # --image-provider nadpisuje
  vision: openai  # kontrola jakości (FR-07)

# Spec §8.3 przewidywała „GPT 5.x mini”; w listopadzie 2026 OpenAI oferuje już tylko rodzinę GPT-6.
# gpt-6-luna to najtańszy model do prostych zadań o dużym wolumenie.
models:
  text: gpt-6-luna
  # Spec §8.3: gpt-image-2.5-flare. OpenAI poleca dla nowych integracji GPT-Image-2.6;
  # Flare to wariant szybki, Sunburst (gpt-image-2.6-sunburst) daje najwyższą jakość.
  image: gpt-image-2.6-flare
  # Spec §8.3: QA używa tego samego modelu co pomysły.
  vision: gpt-6-luna

# Cennik API w USD za milion tokenów (FR-10), przepisany ze strony OpenAI. Koszt wywołania liczy się
# z tokenów zwracanych przez API: wejście × input_per_1m + wyjście × output_per_1m. Tokeny wejścia
# z pamięci podręcznej (tańsze) program liczy po pełnej cenie, więc koszt jest raczej zawyżony.
# Model obrazu: input to tokeny tekstu promptu, output to tokeny grafiki. Model bez ceny w tym
# cenniku to błąd konfiguracji przed pierwszym wywołaniem API.
api_pricing:
  source: https://developers.openai.com/api/docs/pricing
  checked: "2026-11-16"
  models:
    gpt-6-luna: {input_per_1m: 0.10, output_per_1m: 0.50}
    gpt-image-2.6-flare: {input_per_1m: 5.00, output_per_1m: 30.00}
    gpt-image-2.6-sunburst: {input_per_1m: 5.00, output_per_1m: 30.00}
    gpt-image-2.5-flare: {input_per_1m: 5.00, output_per_1m: 30.00}

# Limit kosztu całej książki w USD (FR-10), razem z poprawkami w kolejnych uruchomieniach
# (images, belongs-to, cover, ideas --redo liczą od cost_usd z manifestu); --max-cost nadpisuje.
# Po przekroczeniu program kończy strony w toku, nie zaczyna nowych i kończy się kodem 3; książka,
# która już wydała limit, nie startuje (też kod 3). 50 grafik w jakości medium kosztuje ok. 2.3 USD.
max_cost_usd: 5.00

# Jakość grafik: low, medium, high albo auto (spec §14, pytanie 5: ustalić po spike'u).
image_quality: medium

# Poziom logu kdp-studio.log w katalogu książki (NFR-09): info zapisuje kroki, strony i ich czasy,
# debug dodatkowo każde wywołanie API (czas, tokeny, prompt grafiki). --log-level nadpisuje.
log_level: info

# Liczba grafik generowanych równolegle (FR-05); --concurrency nadpisuje. Zakres 1–16.
concurrency: 4

# Marginesy KDP dla druku bez spadu (spec §7.4). Gdy KDP zmieni tabelę, zmienia się tylko ten blok.
# gutter_in(pages_in_book) to wartość z pierwszego wiersza, dla którego pages_in_book ≤ max_pages.
# Książka grubsza niż ostatni max_pages to błąd walidacji (FR-02).
kdp_margins:
  outside_min_in: 0.25          # zewnętrzne marginesy bez spadu: co najmniej 0.25"
  gutter_by_pages:              # margines przy grzbiecie wg liczby stron książki
    - {max_pages: 150, gutter_in: 0.375}   # 24–150
    - {max_pages: 300, gutter_in: 0.5}     # 151–300
    - {max_pages: 500, gutter_in: 0.625}   # 301–500
    - {max_pages: 700, gutter_in: 0.75}    # 501–700
    - {max_pages: 828, gutter_in: 0.875}   # 701–828

# Okładka paperback (FR-15, `kdp-studio cover`). Wartości KDP: zmienia się je tylko, gdy KDP zmieni
# zasady. Oprawa miękka, wnętrze czarno-białe i biały papier to stałe założenia (spec FR-15).
kdp_cover:
  bleed_in: 0.125
  paper_factor_in: 0.002252     # grubość strony: biały papier, wnętrze czarno-białe
  safe_in: 0.125                # tekst min. tyle od linii cięcia i od linii zgięcia
  spine_safe_in: 0.0625         # tekst grzbietu min. tyle od linii zgięcia
  spine_text_kdp_min_pages: 79
  barcode: {width_in: 2.0, height_in: 1.2, from_spine_in: 0.25, from_bottom_in: 0.25}

# Nasze ustawienia okładki (FR-15).
cover:
  key_margin_in: 0.375          # tytuł, miniatury i inne ważne elementy od linii cięcia i zgięcia
  spine_text_min_pages: 100     # tekst na grzbiecie od tylu stron książki (KDP: min. 79)
  thumbnails: 3                 # miniatury stron na tyle, 3–4
  thumbnail_frame_ratio: 2.0    # ramka miniatury = tyle × grubość zmniejszonych konturów
  thumbnail_frame_min_pt: 2
  thumbnail_check_px: 160       # szerokość miniatury przodu w wynikach Amazon (kontrola czytelności)
  title_band: 0.3               # górna część przodu na tytuł i podtytuł
  subtitle_scale: 0.45
  title_font_pt: 64             # największy rozmiar tytułu; program go zmniejsza, gdy się nie mieści
  spine_font_min_pt: 7
  seam_band_in: 0.1
  seam_max_delta_e: 12
  horizon_tolerance: 0.03
  seam_align_max: 0.2           # tył dopasowany w pionie do przodu przy grzbiecie (listwa, śnieg)
  max_retries: 2
  back_text: false
  title_font: assets/fonts/Fredoka-Variable.ttf
  title_font_variation: Bold
  title_fill_rgb: [255, 255, 255]   # wypełnienie liter tytułu (obrys zawsze czarny K100)
  subtitle_fill_rgb: [255, 230, 120]
  title_outline_pt: 3.0
  thumbnail_min_text_px: 6      # min. wysokość liter tytułu w miniaturze thumbnail_check_px
  title_min_contrast: 3.0       # kontrast WCAG tytułu z tłem (lepszy z wypełnienia i obrysu)
  # Etap 2: model obrazu koloruje szkic przodu (reference_image); --no-color zostawia szkic.
  colorize: true
  color_prompt: >-
    Color this black-and-white coloring book page as the front cover of a children's coloring
    book. Keep every black outline exactly where it is: do not move, redraw, remove or add lines.
    Fill all shapes with vivid but print-friendly colors (no neon, no fluorescent colors). Fill
    the empty band at the top with a calm, simple background such as sky or a soft gradient that
    continues the scene, with no objects in it. Extend the background to all four edges of the
    image. No text, no letters, no title, no logos, no frame, no border.
  contour_match_min: 0.85       # tyle konturów szkicu musi mieć ciemny piksel modelu w pobliżu,
  contour_search_in: 0.02       # w tym promieniu, żeby nałożyć ostre kontury 300 DPI
  title_band_max_edges: 0.01    # więcej krawędzi w pasie tytułu (napis, obiekt) to ponowienie
  # Etap 3: bez --cover-page/--thumbnails strony proponuje model z wizją (arkusz kontaktowy).
  select_pages: true
  qa: false                     # --qa: model z wizją sprawdza gotową okładkę
  in_generate: false            # generate --cover: okładka jako ostatni krok (wybór stron modelem)
  # Tło tyłu i grzbietu (przy --color): jedno wywołanie, przód jako referencja. Pola wypełnia
  # program: {horizon} (zdanie o horyzoncie), {colors} (kolory przy lewej krawędzi przodu),
  # {spine_pct} (szerokość grzbietu z zapasem, % obrazu), {margin_pct} (key_margin_in, %).
  back_prompt: >-
    Paint the back cover and spine of the same children's coloring book as the reference
    image, which is its front cover. Make one wide background picture in the same style,
    palette and lighting, as if the world of the front cover continued to the left.
    {horizon} Along the right edge, where it joins the front cover, the background colors
    from top to bottom are: {colors}. The right {spine_pct}% of the picture is the spine:
    only plain background there, no objects. Keep the bottom right corner calm and plain.
    Keep any objects at least {margin_pct}% away from every edge and keep the middle mostly
    calm background, because thumbnails of inner pages will be placed on it. Use vivid but
    print-friendly colors (no neon, no fluorescent colors). No text, no letters, no title,
    no logos, no frame, no border.
  # Tył jako dorysowanie przodu: płótno z lewym pasem przodu (co najmniej outpaint_overlap_min
  # jego szerokości) po prawej i maską na pustej części. Model ciągnie dalej listwy, deski czy
  # śnieg zamiast malować podobną scenę. Bez pasującej proporcji modelu (albo outpaint: false)
  # tył powstaje z back_prompt. Pola: {area_pct} (pusta część, % płótna), {spine_pct} (grzbiet
  # z zapasem, % pustej części), {margin_pct} (key_margin_in, %).
  outpaint: true
  outpaint_overlap_min: 0.2
  outpaint_prompt: >-
    Extend this picture to the left. The right part is the left edge of the front cover of a
    children's coloring book; the empty white area on the left ({area_pct}% of the width) is the
    back cover and spine of the same book. Fill the empty area so that the picture continues
    seamlessly: the same wall, floor, ground or sky, the same lines, boards and horizon at
    exactly the same height, the same style, palette and lighting. Do not change the right part.
    Do not continue characters or objects cut by the edge into the new area. The right
    {spine_pct}% of the new area, next to the existing part, is the spine: only plain background
    there, no objects. Keep the bottom right corner of the new area calm and plain. Keep any new
    objects at least {margin_pct}% away from the edges of the new area and keep its middle
    mostly calm background, because thumbnails of inner pages will be placed on it. Use vivid
    but print-friendly colors (no neon, no fluorescent colors). No text, no letters, no title,
    no logos, no frame, no border.
  seam_bands: 8                 # pasy poziome przy kontroli styku grzbiet/przód (ΔE)
  back_text_pt: 16              # opis z metadanych na tyle (back_text: true)
  back_text_min_pt: 10
  back_text_max_height: 0.3     # opis zajmuje najwyżej tyle wysokości strefy tyłu
  cmyk:
    # Profil ICC do konwersji RGB → CMYK (nie trafia do PDF). KDP żadnego nie wskazuje. Domyślnie
    # SWOP 2013 (CRPC5, TAC 300%) z rejestru ICC, dołączony do repozytorium (licencja IDEAlliance
    # pozwala go udostępniać bez zmian, assets/icc/README.md). Inny profil, np. U.S. Web Coated
    # (SWOP) v2 z pakietu Adobe, którego nie wolno dołączać, wskazujesz zmienną
    # KDP_STUDIO_CMYK_PROFILE w .env; ma ona pierwszeństwo przed tym ustawieniem.
    profile: assets/icc/SWOP2013C3_CRPC5.icc
    rendering_intent: perceptual          # albo relative_colorimetric
    black_point_compensation: true
    max_total_ink_pct: 300                # 240 dla drukarni z takim wymaganiem (np. IngramSpark)
    gamut_warn_delta_e: 10
    gamut_warn_area_pct: 5
  template_colors:              # skalibrowane na szablonach KDP (tests/fixtures/kdp_templates/)
    live_bleed_pink: {rgb: [255, 175, 176], tolerance: 40}
    barcode_yellow: {rgb: [255, 255, 0], tolerance: 60}
    fold_blue: {rgb: [18, 6, 220], tolerance: 60}
    trim_black: {rgb: [0, 0, 0], tolerance: 80}
  template_tolerance_in: 0.01

# A+ Content (FR-24, `kdp-studio aplus`): grafiki i teksty modułów pod opisem na stronie Amazona.
# Moduły w kolejności na stronie, najwyżej 5: logo (baner wydawcy, plik z `logo`), header_fan
# (wachlarz okładek), header_pages (kilka stron wnętrza; zastępuje tabelę, gdy ta nie ma książek),
# overlay_facts (nakładka z faktami z manifestu), features (3 albo 4 kolumny ze stronami),
# comparison (tabela porównawcza własnych książek). Grafiki składa program bez API.
aplus:
  modules: [logo, header_fan, overlay_facts, features, comparison]
  logo: null                    # baner 600 × 180 przygotowany poza programem (JPG/PNG, RGB)
  logo_alt: null                # tekst alternatywny banera (A+ wymaga go przy każdej grafice)
  image_format: jpg             # JPG mieści wachlarz w 0,4 MB; PNG ma ok. 1,9 MB przy limicie 2 MB
  jpeg_quality: 90
  scale: 2                      # obrazy w dwukrotności proporcji z edytora (970 × 600 → 1940 × 1200)
  max_file_mb: 2.0              # limit A+ na plik
  color_page: false             # --color-page: pokolorowana strona z modelu obrazu (płatna)
  limits:                       # znaki, z edytora A+ (24.11.2026)
    header: {headline: 200, body: 6000}
    columns: {module_headline: 200, headline: 160, body: 1000}
    overlay: {headline: 60, body: 300}
    alt_text: 99                # tekst alternatywny każdej grafiki; pole edytora: najwyżej 99 znaków
  header_fan:                   # referencja: docs/aplus/naglowek_wachlarz_referencja.jpg
    front_angle_deg: 7          # przód na wierzchu, obrócony w lewo
    back_angle_deg: -9          # tył pod spodem, obrócony w prawo
    back_offset: 0.62           # przesunięcie tyłu w bokach okładki
    size: 0.83                  # bok okładki względem wysokości grafiki (największy, który się mieści)
    left: 0.04                  # lewy brzeg przodu względem szerokości grafiki
    page_edge: 0.0083           # blok kartek względem boku okładki (ok. 1/120)
    spine_shade: 0.85           # grzbiet tyłu lekko w cieniu
    shadow: {blur: 0.022, offset: [0.016, 0.024], opacity: 0.4}
    background:
      candidates:
        beż: [226, 212, 190]
        szałwia: [200, 212, 190]
        pudrowy róż: [232, 206, 200]
        szaroniebieski: [200, 210, 222]
        ciepły szary: [214, 208, 200]
      min_delta_e: 15           # do ustalenia po kilku okładkach
      percentile: 5             # percentyl odległości od pasa brzegowego okładek
      border: 0.04              # pas brzegowy okładki (ułamek boku)
      darken_step: 0.05         # przyciemnianie najlepszego, gdy żaden nie przechodzi progu
      gradient: 0.04            # lekki pionowy gradient
  header_pages: {count: 3, angles_deg: [8, 0, -8], size: 0.78}
  overlay_facts:                # pas pod nakładkę z faktami (970 × 300)
    text_side: right            # ramka z tekstem Amazona na komputerze: po prawej (podgląd 28.11.2026)
    text_width: 0.33            # szerokość ramki z marginesem; strony idą na drugą stronę
    margin: 0.03
    margin_y: 0.12
    overlap: 0.15
  features: {columns: 3, margin: 0.06}    # 3 albo 4 kolumny
  comparison:                   # tabela porównawcza: 2–6 książek z własnego konta KDP
    books: []                   # [{asin: B0XXXXXXXX, book: output/<katalog>}]; zwykle w --config-file
