# Ustawienia domyślne (spec §9.2). Flagi CLI nadpisują te wartości.
# Kolejne klucze (np. cenniki) dochodzą razem z wymaganiami, które ich używają.

# Strony przed grafikami: strona tytułowa i „This book belongs to…” (FR-02).
front_matter_pages: 2

# Strona „This book belongs to…” (FR-14), jedna ze stron wstępnych: --belongs-to-page włącza.
# Model obrazu rysuje tylko ramkę z motywem książki wokół pustej tabliczki, a napis i linię na
# imię wpisuje program czcionką z assets/fonts (SIL OFL). Gdy pole na tekst (text_box, ułamki
# obszaru treści) ma więcej tuszu niż max_ink_ratio, strona jest generowana ponownie, najwyżej
# max_retries razy; potem układ zapasowy: grafika pierwszej strony książki w górnej części
# (fallback_art_height) i napis pod nią.
belongs_to_page:
  enabled: false
  text: "This book belongs to:"
  composition: >-
    a decorative frame made of theme elements around a large empty blank plaque in the center
    of the page, the plaque is completely empty with nothing written or drawn inside it
  text_box: {x: 0.2, y: 0.37, width: 0.6, height: 0.3}
  max_ink_ratio: 0.005
  max_retries: 2
  font: assets/fonts/Fredoka-Variable.ttf
  font_variation: SemiBold
  fallback_art_height: 0.55

# Zapas pomysłów na strony odrzucone przez QA: pages + ceil(pages * reserve_ratio) (FR-03).
reserve_ratio: 0.2

# Weryfikacja pomysłów przed generowaniem grafik (FR-03a): osobne wywołanie modelu tekstowego
# ocenia każdy pomysł, poprawia albo odrzuca te niepasujące do tematu, a zapas je zastępuje.
# Kosztuje ułamek centa na książkę, mniej niż jedna wyrzucona grafika. --no-review-ideas wyłącza.
review_ideas: true

# Różnorodność pomysłów (FR-03b): najwyższy udział stron książki z tą samą czynnością postaci,
# tym samym miejscem akcji i tym samym przedmiotem w scenie (0–1]. Minimalny udział scen z kilkoma
# postaciami jest w profilu wieku (multi_subject_share). Przy weryfikacji pomysłów program
# wyrównuje rozkład zamianą z zapasem, a potem poprawkami LLM; reszta problemów to ostrzeżenia.
diversity:
  max_action_share: 0.3
  max_setting_share: 0.3
  max_element_share: 0.35

# Kontrola jakości grafik modelem z wizją (FR-07): --qa / --no-qa nadpisuje. Strona odrzucona
# przez QA jest generowana ponownie z zapasowego pomysłu, najwyżej qa_max_retries razy (0–5).
qa: false
qa_max_retries: 2

# Język metadanych książki (tytuł, opis, słowa kluczowe). Spec §14, pytanie 2: na razie rynek US.
metadata_language: English

# Implementacje z rejestru src/kdp_studio/providers/registry.py.
providers:
  text: openai
  image: openai   # --image-provider nadpisuje
  vision: openai  # kontrola jakości (FR-07)

# Spec §8.3 przewidywała „GPT 5.x mini”; w listopadzie 2026 OpenAI oferuje już tylko rodzinę GPT-6.
# gpt-6-luna to najtańszy model do prostych zadań o dużym wolumenie.
models:
  text: gpt-6-luna
  # Spec §8.3: gpt-image-2.5-flare. OpenAI poleca dla nowych integracji GPT-Image-2.6;
  # Flare to wariant szybki, Sunburst (gpt-image-2.6-sunburst) daje najwyższą jakość.
  image: gpt-image-2.6-flare
  # Spec §8.3: QA używa tego samego modelu co pomysły.
  vision: gpt-6-luna

# Cennik API w USD za milion tokenów (FR-10), przepisany ze strony OpenAI. Koszt wywołania liczy się
# z tokenów zwracanych przez API: wejście × input_per_1m + wyjście × output_per_1m. Tokeny wejścia
# z pamięci podręcznej (tańsze) program liczy po pełnej cenie, więc koszt jest raczej zawyżony.
# Model obrazu: input to tokeny tekstu promptu, output to tokeny grafiki. Model bez ceny w tym
# cenniku to błąd konfiguracji przed pierwszym wywołaniem API.
api_pricing:
  source: https://developers.openai.com/api/docs/pricing
  checked: "2026-11-16"
  models:
    gpt-6-luna: {input_per_1m: 0.10, output_per_1m: 0.50}
    gpt-image-2.6-flare: {input_per_1m: 5.00, output_per_1m: 30.00}
    gpt-image-2.6-sunburst: {input_per_1m: 5.00, output_per_1m: 30.00}
    gpt-image-2.5-flare: {input_per_1m: 5.00, output_per_1m: 30.00}

# Limit kosztu jednego uruchomienia komendy w USD (FR-10); --max-cost nadpisuje. Po przekroczeniu
# program kończy strony w toku, nie zaczyna nowych i kończy się kodem 3. 50 grafik w jakości
# medium kosztuje ok. 2.3 USD.
max_cost_usd: 5.00

# Jakość grafik: low, medium, high albo auto (spec §14, pytanie 5: ustalić po spike'u).
image_quality: medium

# Poziom logu kdp-studio.log w katalogu książki (NFR-09): info zapisuje kroki, strony i ich czasy,
# debug dodatkowo każde wywołanie API (czas, tokeny, prompt grafiki). --log-level nadpisuje.
log_level: info

# Liczba grafik generowanych równolegle (FR-05); --concurrency nadpisuje. Zakres 1–16.
concurrency: 4

# Marginesy KDP dla druku bez spadu (spec §7.4). Gdy KDP zmieni tabelę, zmienia się tylko ten blok.
# gutter_in(pages_in_book) to wartość z pierwszego wiersza, dla którego pages_in_book ≤ max_pages.
# Książka grubsza niż ostatni max_pages to błąd walidacji (FR-02).
kdp_margins:
  outside_min_in: 0.25          # zewnętrzne marginesy bez spadu: co najmniej 0.25"
  gutter_by_pages:              # margines przy grzbiecie wg liczby stron książki
    - {max_pages: 150, gutter_in: 0.375}   # 24–150
    - {max_pages: 300, gutter_in: 0.5}     # 151–300
    - {max_pages: 500, gutter_in: 0.625}   # 301–500
    - {max_pages: 700, gutter_in: 0.75}    # 501–700
    - {max_pages: 828, gutter_in: 0.875}   # 701–828

# Okładka paperback (FR-15, `kdp-studio cover`). Wartości KDP: zmienia się je tylko, gdy KDP zmieni
# zasady. Oprawa miękka, wnętrze czarno-białe i biały papier to stałe założenia (spec FR-15).
kdp_cover:
  bleed_in: 0.125
  paper_factor_in: 0.002252     # grubość strony: biały papier, wnętrze czarno-białe
  safe_in: 0.125                # tekst min. tyle od linii cięcia i od linii zgięcia
  spine_safe_in: 0.0625         # tekst grzbietu min. tyle od linii zgięcia
  spine_text_kdp_min_pages: 79
  barcode: {width_in: 2.0, height_in: 1.2, from_spine_in: 0.25, from_bottom_in: 0.25}

# Nasze ustawienia okładki (FR-15).
cover:
  key_margin_in: 0.375          # tytuł, miniatury i inne ważne elementy od linii cięcia i zgięcia
  spine_text_min_pages: 100     # tekst na grzbiecie od tylu stron książki (KDP: min. 79)
  thumbnails: 3                 # miniatury stron na tyle, 3–4
  thumbnail_frame_ratio: 2.0    # ramka miniatury = tyle × grubość zmniejszonych konturów
  thumbnail_frame_min_pt: 2
  thumbnail_check_px: 160       # szerokość miniatury przodu w wynikach Amazon (kontrola czytelności)
  title_band: 0.3               # górna część przodu na tytuł i podtytuł
  subtitle_scale: 0.45
  title_font_pt: 64             # największy rozmiar tytułu; program go zmniejsza, gdy się nie mieści
  spine_font_min_pt: 7
  seam_band_in: 0.1
  seam_max_delta_e: 12
  horizon_tolerance: 0.03
  seam_align_max: 0.2           # tył dopasowany w pionie do przodu przy grzbiecie (listwa, śnieg)
  max_retries: 2
  back_text: false
  title_font: assets/fonts/Fredoka-Variable.ttf
  title_font_variation: Bold
  title_fill_rgb: [255, 255, 255]   # wypełnienie liter tytułu (obrys zawsze czarny K100)
  subtitle_fill_rgb: [255, 230, 120]
  title_outline_pt: 3.0
  thumbnail_min_text_px: 6      # min. wysokość liter tytułu w miniaturze thumbnail_check_px
  title_min_contrast: 3.0       # kontrast WCAG tytułu z tłem (lepszy z wypełnienia i obrysu)
  # Etap 2: model obrazu koloruje szkic przodu (reference_image); --no-color zostawia szkic.
  colorize: true
  color_prompt: >-
    Color this black-and-white coloring book page as the front cover of a children's coloring
    book. Keep every black outline exactly where it is: do not move, redraw, remove or add lines.
    Fill all shapes with vivid but print-friendly colors (no neon, no fluorescent colors). Fill
    the empty band at the top with a calm, simple background such as sky or a soft gradient that
    continues the scene, with no objects in it. Extend the background to all four edges of the
    image. No text, no letters, no title, no logos, no frame, no border.
  contour_match_min: 0.85       # tyle konturów szkicu musi mieć ciemny piksel modelu w pobliżu,
  contour_search_in: 0.02       # w tym promieniu, żeby nałożyć ostre kontury 300 DPI
  # Etap 3: bez --cover-page/--thumbnails strony proponuje model z wizją (arkusz kontaktowy).
  select_pages: true
  qa: false                     # --qa: model z wizją sprawdza gotową okładkę
  in_generate: false            # generate --cover: okładka jako ostatni krok (wybór stron modelem)
  # Tło tyłu i grzbietu (przy --color): jedno wywołanie, przód jako referencja. Pola wypełnia
  # program: {horizon} (zdanie o horyzoncie), {colors} (kolory przy lewej krawędzi przodu),
  # {spine_pct} (szerokość grzbietu z zapasem, % obrazu), {margin_pct} (key_margin_in, %).
  back_prompt: >-
    Paint the back cover and spine of the same children's coloring book as the reference
    image, which is its front cover. Make one wide background picture in the same style,
    palette and lighting, as if the world of the front cover continued to the left.
    {horizon} Along the right edge, where it joins the front cover, the background colors
    from top to bottom are: {colors}. The right {spine_pct}% of the picture is the spine:
    only plain background there, no objects. Keep the bottom right corner calm and plain.
    Keep any objects at least {margin_pct}% away from every edge and keep the middle mostly
    calm background, because thumbnails of inner pages will be placed on it. Use vivid but
    print-friendly colors (no neon, no fluorescent colors). No text, no letters, no title,
    no logos, no frame, no border.
  seam_bands: 8                 # pasy poziome przy kontroli styku grzbiet/przód (ΔE)
  back_text_pt: 16              # opis z metadanych na tyle (back_text: true)
  back_text_min_pt: 10
  back_text_max_height: 0.3     # opis zajmuje najwyżej tyle wysokości strefy tyłu
  cmyk:
    # Profil ICC do konwersji RGB → CMYK (nie trafia do PDF). KDP żadnego nie wskazuje; poradniki
    # podają U.S. Web Coated (SWOP) v2, alternatywnie GRACoL 2006 Coated. Plik pobierasz sam
    # (licencja profilu), np. pakiet „ICC profiles” ze strony pomocy Adobe, i podajesz ścieżkę.
    # Na macOS jest też /System/Library/ColorSync/Profiles/Generic CMYK Profile.icc (do prób).
    profile: null
    rendering_intent: perceptual          # albo relative_colorimetric
    black_point_compensation: true
    max_total_ink_pct: 300                # 240 dla drukarni z takim wymaganiem (np. IngramSpark)
    gamut_warn_delta_e: 10
    gamut_warn_area_pct: 5
  template_colors:              # skalibrowane na szablonach KDP (tests/fixtures/kdp_templates/)
    live_bleed_pink: {rgb: [255, 175, 176], tolerance: 40}
    barcode_yellow: {rgb: [255, 255, 0], tolerance: 60}
    fold_blue: {rgb: [18, 6, 220], tolerance: 60}
    trim_black: {rgb: [0, 0, 0], tolerance: 80}
  template_tolerance_in: 0.01
