# Profile wieku odbiorcy (spec §7.1).
#
# Klucz profilu = wartość parametru --age.
#   name, description  – wyświetlane przez `kdp-studio profiles age` (FR-12)
#   line, subjects, background, fill_areas – charakterystyka grafiki (dokumentacja i wejście dla LLM w FR-03)
#   prompt_fragment    – fragment promptu obrazu (FR-04), po angielsku
#   multi_subject_share – minimalny udział stron z 2+ postaciami (FR-03b), 0–1; 0 wyłącza
#   age_range          – wiek dzieci [od, do] do wzoru wieku rynku (FR-19, terms.ages w markets.yaml);
#                        brak = dorośli (terms.adults)
#   belongs_to         – strona „This book belongs to…” (FR-14): wielkość napisu (font_pt, program
#                        zmniejsza go, gdy nie mieści się w polu), wysokość miejsca na imię
#                        (name_line_height_in) i litery konturowe do pokolorowania (outline_text)
#   aplus_features     – motywy kolumn A+ z grafiką z modelu (FR-24, aplus.features.source: generated),
#                        w kolejności kolumn: key, label (po polsku), scene (prompt i opis do alt
#                        textu, po angielsku), benefit (o czym pisze kolumna, po angielsku),
#                        requires: single_sided (tylko książki jednostronne), fact: single_sided
#                        (kolumna przejmuje fakt o druku, nakładka go pomija)
#                        i checks: kryteria kontroli grafiki (aplus --qa), po angielsku
#   postprocess        – parametry obróbki (FR-06); cienkie linie wymagają łagodniejszego
#                        usuwania szumu niż grube linie dla najmłodszych
#     threshold        – "otsu" albo liczba 0–255
#     min_speck_area   – plamki mniejsze niż tyle pikseli (w rozdzielczości surowej grafiki) są usuwane
#     potrace.turdsize     – potrace: pomija kontury o powierzchni ≤ turdsize px
#     potrace.alphamax     – potrace: wygładzanie narożników (0 = ostre, 1.334 = brak narożników)
#     potrace.opttolerance – potrace: tolerancja optymalizacji krzywych

przedszkole:
  name: Przedszkole (3–5 lat)
  age_range: [3, 5]
  description: Jeden duży, prosty obiekt, bardzo grube kontury, bez tła.
  line: very thick
  subjects: "1 large, simple shapes"
  background: none
  fill_areas: large, closed
  prompt_fragment: >-
    very thick bold outlines, one large simple subject, minimal details,
    no background, large closed areas, the whole drawing fits inside the image with white space
    on every side, for toddlers
  multi_subject_share: 0.0
  belongs_to:
    font_pt: 48
    name_line_height_in: 1.0
    outline_text: true
  aplus_features:   # FR-24: motywy kolumn A+ z grafiką z modelu (aplus.features.source: generated)
    - key: thick_lines
      label: Grube kontury dla małych rąk
      scene: "a small child's hand holding a chunky wax crayon, colouring the coloring page from the book on a wooden table, a few crayons nearby"
      benefit: "thick, simple outlines and big shapes that small hands can colour"
      checks:
        - "a small child's hand is colouring the page with a chunky crayon"
    - key: together
      label: Wspólne kolorowanie z rodzicem
      scene: "an adult's hand and a small child's hand colouring the same coloring page from the book together, crayons spread around"
      benefit: "a calm activity a parent and a child can share"
      checks:
        - "two hands, an adult's and a small child's, colour the same page"
    - key: fridge
      label: Obrazek na lodówce
      scene: "the coloring page from the book, neatly cut out and coloured in, held on a white fridge door with a round magnet"
      benefit: "every picture is printed on its own sheet, so a finished one can be cut out and shown off"
      requires: single_sided
      checks:
        - "a single coloured sheet hangs on a fridge door, held by a magnet"
    - key: screen_free
      label: Spokojna chwila bez ekranu
      scene: "the open coloring book lying on a cosy table with a box of crayons and a cup of warm milk, soft daylight"
      benefit: "a quiet, screen-free activity for a calm afternoon"
      checks:
        - "no screens, phones or tablets are visible"
  postprocess:
    threshold: otsu
    min_speck_area: 64
    potrace:
      turdsize: 16
      alphamax: 1.2
      opttolerance: 0.4

wczesnoszkolne:
  name: Wczesnoszkolne (6–8 lat)
  age_range: [6, 8]
  description: Prosta scena z 1–3 postaciami, grube kontury, proste tło.
  line: thick
  subjects: "1-3"
  background: simple
  fill_areas: medium
  prompt_fragment: >-
    thick clean outlines, simple scene with 1-3 subjects, simple background,
    the whole scene fits inside the image with white space on every side, nothing cut off
    by the edges, for kids 6-8
  multi_subject_share: 0.25
  belongs_to:
    font_pt: 42
    name_line_height_in: 0.85
    outline_text: true
  aplus_features:   # FR-24: motywy kolumn A+ z grafiką z modelu (aplus.features.source: generated)
    - key: story_scenes
      label: Sceny z postaciami do opowiadania
      scene: "a child's hand with a coloured pencil colouring the coloring page from the book, partly coloured in, on a table"
      benefit: "scenes with characters that invite the child to tell their own story"
    - key: markers
      label: Pisaki nie zniszczą następnego obrazka
      scene: "the coloring page from the book coloured with bright felt-tip markers, the uncapped markers lying beside it; next to it a second loose sheet lies turned over, its back completely blank white paper"
      benefit: "single-sided pages: markers can bleed through, but never onto the next picture"
      requires: single_sided
      fact: single_sided
      checks:
        - "the coloring page is coloured with felt-tip markers (solid, even ink, markers visible next to it), not with wax crayons or coloured pencils"
        - "the turned-over sheet shows a completely blank white back: no drawing, no stars, no decorations, no bleed-through picture"
    - key: screen_free
      label: Spokojna chwila bez ekranu
      scene: "the open coloring book on a kitchen table with crayons and a mug of cocoa, decorated in the mood of the book's theme"
      benefit: "a calm, screen-free activity for an afternoon at home"
      checks:
        - "no screens, phones or tablets are visible"
    - key: show_off
      label: Gotowe dzieło do pokazania
      scene: "the coloring page from the book, coloured in, pinned to a cork board with colourful pins"
      benefit: "finished pictures the child is proud to show"
      requires: single_sided
  postprocess:
    threshold: otsu
    min_speck_area: 40
    potrace:
      turdsize: 10
      alphamax: 1.1
      opttolerance: 0.3

szkolne:
  name: Szkolne (9–12 lat)
  age_range: [9, 12]
  description: Pełna scena z tłem, średnie linie, umiarkowana szczegółowość.
  line: medium
  subjects: full scene
  background: "yes"
  fill_areas: more detail
  prompt_fragment: >-
    medium outlines, full scene, moderate detail, background lines such as floor, walls or
    horizon may run to the edges but no object is cut off, for kids 9-12
  multi_subject_share: 0.3
  belongs_to:
    font_pt: 36
    name_line_height_in: 0.7
    outline_text: false
  aplus_features:   # FR-24: motywy kolumn A+ z grafiką z modelu (aplus.features.source: generated)
    - key: detail
      label: Szczegółowe sceny na dłużej
      scene: "a hand with a coloured pencil colouring the coloring page from the book, about half coloured in, pencils fanned out on a desk"
      benefit: "detailed scenes that keep a child busy for longer"
    - key: fineliners
      label: Pisaki i cienkopisy
      scene: "the coloring page from the book coloured with fine-liners and felt-tip markers, the uncapped pens lying beside it; next to it a second loose sheet lies turned over, its back completely blank white paper"
      benefit: "single-sided pages: markers and fine-liners never spoil the next picture"
      requires: single_sided
      fact: single_sided
      checks:
        - "the coloring page is coloured with felt-tip markers (solid, even ink, markers visible next to it), not with wax crayons or coloured pencils"
        - "the turned-over sheet shows a completely blank white back: no drawing, no stars, no decorations, no bleed-through picture"
    - key: own_colors
      label: Własne kolory
      scene: "two copies of the coloring page from the book side by side on a desk, coloured in two different colour palettes"
      benefit: "room for the child's own colour ideas"
      checks:
        - "both copies show the same drawing in two different colour sets"
    - key: screen_free
      label: Spokojne popołudnie bez ekranu
      scene: "the open coloring book on a desk by a window with a pencil case and coloured pencils"
      benefit: "a quiet, screen-free afternoon activity"
      checks:
        - "no screens, phones or tablets are visible"
  postprocess:
    threshold: otsu
    min_speck_area: 24
    potrace:
      turdsize: 6
      alphamax: 1.0
      opttolerance: 0.2

nastolatki:
  name: Nastolatki (13–17 lat)
  age_range: [13, 17]
  description: Szczegółowa, stylizowana scena z wzorami dekoracyjnymi, cienkie linie.
  line: thin
  subjects: stylized scene
  background: full
  fill_areas: patterns
  prompt_fragment: >-
    fine clean lines, detailed scene, decorative patterns, detailed background may extend
    to the edges of the image, for teens
  multi_subject_share: 0.2
  belongs_to:
    font_pt: 32
    name_line_height_in: 0.6
    outline_text: false
  aplus_features:   # FR-24: motywy kolumn A+ z grafiką z modelu (aplus.features.source: generated)
    - key: patterns
      label: Wzory i detale
      scene: "a hand with a fine-liner colouring small details of the coloring page from the book, close-up on a desk"
      benefit: "detailed patterns for patient, precise colouring"
    - key: own_style
      label: Własny styl
      scene: "the coloring page from the book coloured with gel pens and markers, the pens lying around it on a desk"
      benefit: "space for the teen's own style and colour choices"
    - key: markers
      label: Pisaki nie zniszczą następnej strony
      scene: "the coloring page from the book coloured with felt-tip markers, the uncapped markers lying beside it; next to it a second loose sheet lies turned over, its back completely blank white paper"
      benefit: "single-sided pages: markers never spoil the next picture"
      requires: single_sided
      fact: single_sided
      checks:
        - "the coloring page is coloured with felt-tip markers (solid, even ink, markers visible next to it), not with wax crayons or coloured pencils"
        - "the turned-over sheet shows a completely blank white back: no drawing, no stars, no decorations, no bleed-through picture"
    - key: phone_down
      label: Odpoczynek od telefonu
      scene: "the open coloring book on a bed with coloured pencils, a smartphone lying face down next to it"
      benefit: "a break from screens"
      checks:
        - "the phone lies face down, its screen not visible"
  postprocess:
    threshold: otsu
    min_speck_area: 12
    potrace:
      turdsize: 3
      alphamax: 0.9
      opttolerance: 0.2

dorosli:
  name: Dorośli
  description: Gęste wzory, mandale i zentangle, bardzo cienkie linie, wiele drobnych pól.
  line: very thin
  subjects: patterns, mandalas, zentangle
  background: dense
  fill_areas: small
  prompt_fragment: >-
    fine intricate line work, highly detailed patterns, many small areas to color,
    background and patterns may extend to the edges of the image, for adults
  multi_subject_share: 0.0
  belongs_to:
    font_pt: 30
    name_line_height_in: 0.55
    outline_text: false
  aplus_features:   # FR-24: motywy kolumn A+ z grafiką z modelu (aplus.features.source: generated)
    - key: unwind
      label: Relaks po dniu
      scene: "the open coloring book on a table in warm evening light with a cup of tea and coloured pencils"
      benefit: "a relaxing, screen-free hobby for the evening"
    - key: precision
      label: Drobne pola dla precyzji
      scene: "close-up of an adult's hand with a fine-liner colouring tiny areas of the coloring page from the book"
      benefit: "intricate areas for precise, mindful colouring"
    - key: markers
      label: Pisaki z podłożoną kartką
      scene: "the coloring page from the book coloured with felt-tip markers, the uncapped markers lying beside it, a spare blank sheet of paper slipped under the page"
      benefit: "single-sided pages: with a spare sheet underneath, markers never spoil the next design"
      requires: single_sided
      fact: single_sided
      checks:
        - "the coloring page is coloured with felt-tip markers (solid, even ink, markers visible next to it), not with wax crayons or coloured pencils"
        - "the spare sheet under the page is blank white paper: no drawing, no decorations"
    - key: framed
      label: Obrazek do oprawienia
      scene: "the coloring page from the book, fully coloured, in a simple wooden frame on a wall"
      benefit: "finished designs worth framing"
      requires: single_sided
  postprocess:
    threshold: otsu
    min_speck_area: 6
    potrace:
      turdsize: 2
      alphamax: 0.8
      opttolerance: 0.1
