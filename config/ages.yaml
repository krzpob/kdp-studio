# Profile wieku odbiorcy (spec §7.1).
#
# Klucz profilu = wartość parametru --age.
#   name, description  – wyświetlane przez `kdp-studio profiles age` (FR-12)
#   line, subjects, background, fill_areas – charakterystyka grafiki (dokumentacja i wejście dla LLM w FR-03)
#   prompt_fragment    – fragment promptu obrazu (FR-04), po angielsku
#   multi_subject_share – minimalny udział stron z 2+ postaciami (FR-03b), 0–1; 0 wyłącza
#   age_range          – wiek dzieci [od, do] do wzoru wieku rynku (FR-19, terms.ages w markets.yaml);
#                        brak = dorośli (terms.adults)
#   belongs_to         – strona „This book belongs to…” (FR-14): wielkość napisu (font_pt, program
#                        zmniejsza go, gdy nie mieści się w polu), wysokość miejsca na imię
#                        (name_line_height_in) i litery konturowe do pokolorowania (outline_text)
#   postprocess        – parametry obróbki (FR-06); cienkie linie wymagają łagodniejszego
#                        usuwania szumu niż grube linie dla najmłodszych
#     threshold        – "otsu" albo liczba 0–255
#     min_speck_area   – plamki mniejsze niż tyle pikseli (w rozdzielczości surowej grafiki) są usuwane
#     potrace.turdsize     – potrace: pomija kontury o powierzchni ≤ turdsize px
#     potrace.alphamax     – potrace: wygładzanie narożników (0 = ostre, 1.334 = brak narożników)
#     potrace.opttolerance – potrace: tolerancja optymalizacji krzywych

przedszkole:
  name: Przedszkole (3–5 lat)
  age_range: [3, 5]
  description: Jeden duży, prosty obiekt, bardzo grube kontury, bez tła.
  line: very thick
  subjects: "1 large, simple shapes"
  background: none
  fill_areas: large, closed
  prompt_fragment: >-
    very thick bold outlines, one large simple subject, minimal details,
    no background, large closed areas, the whole drawing fits inside the image with white space
    on every side, for toddlers
  multi_subject_share: 0.0
  belongs_to:
    font_pt: 48
    name_line_height_in: 1.0
    outline_text: true
  postprocess:
    threshold: otsu
    min_speck_area: 64
    potrace:
      turdsize: 16
      alphamax: 1.2
      opttolerance: 0.4

wczesnoszkolne:
  name: Wczesnoszkolne (6–8 lat)
  age_range: [6, 8]
  description: Prosta scena z 1–3 postaciami, grube kontury, proste tło.
  line: thick
  subjects: "1-3"
  background: simple
  fill_areas: medium
  prompt_fragment: >-
    thick clean outlines, simple scene with 1-3 subjects, simple background,
    the whole scene fits inside the image with white space on every side, nothing cut off
    by the edges, for kids 6-8
  multi_subject_share: 0.25
  belongs_to:
    font_pt: 42
    name_line_height_in: 0.85
    outline_text: true
  postprocess:
    threshold: otsu
    min_speck_area: 40
    potrace:
      turdsize: 10
      alphamax: 1.1
      opttolerance: 0.3

szkolne:
  name: Szkolne (9–12 lat)
  age_range: [9, 12]
  description: Pełna scena z tłem, średnie linie, umiarkowana szczegółowość.
  line: medium
  subjects: full scene
  background: "yes"
  fill_areas: more detail
  prompt_fragment: >-
    medium outlines, full scene, moderate detail, background lines such as floor, walls or
    horizon may run to the edges but no object is cut off, for kids 9-12
  multi_subject_share: 0.3
  belongs_to:
    font_pt: 36
    name_line_height_in: 0.7
    outline_text: false
  postprocess:
    threshold: otsu
    min_speck_area: 24
    potrace:
      turdsize: 6
      alphamax: 1.0
      opttolerance: 0.2

nastolatki:
  name: Nastolatki (13–17 lat)
  age_range: [13, 17]
  description: Szczegółowa, stylizowana scena z wzorami dekoracyjnymi, cienkie linie.
  line: thin
  subjects: stylized scene
  background: full
  fill_areas: patterns
  prompt_fragment: >-
    fine clean lines, detailed scene, decorative patterns, detailed background may extend
    to the edges of the image, for teens
  multi_subject_share: 0.2
  belongs_to:
    font_pt: 32
    name_line_height_in: 0.6
    outline_text: false
  postprocess:
    threshold: otsu
    min_speck_area: 12
    potrace:
      turdsize: 3
      alphamax: 0.9
      opttolerance: 0.2

dorosli:
  name: Dorośli
  description: Gęste wzory, mandale i zentangle, bardzo cienkie linie, wiele drobnych pól.
  line: very thin
  subjects: patterns, mandalas, zentangle
  background: dense
  fill_areas: small
  prompt_fragment: >-
    fine intricate line work, highly detailed patterns, many small areas to color,
    background and patterns may extend to the edges of the image, for adults
  multi_subject_share: 0.0
  belongs_to:
    font_pt: 30
    name_line_height_in: 0.55
    outline_text: false
  postprocess:
    threshold: otsu
    min_speck_area: 6
    potrace:
      turdsize: 2
      alphamax: 0.8
      opttolerance: 0.1
