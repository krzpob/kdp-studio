<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- FR-23: zapasowa ilustracja instrukcji (bez postaci): otwarta kolorowanka, pod prawą stronę
       wsuwa się kartka grubszego papieru, strzałki pokazują ruch. Same kontury, do kolorowania. -->
  <rect width="1200" height="800" fill="#ffffff"/>
  <g fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- kartka grubszego papieru, wsuwana od prawej pod prawą stronę książki -->
    <path d="M700 300 L1110 250 L1150 610 L740 660 Z" fill="#ffffff"/>
    <!-- otwarta książka: lewa i prawa strona, grzbiet -->
    <path d="M140 220 Q370 170 600 230 L600 640 Q370 580 140 630 Z" fill="#ffffff"/>
    <path d="M600 230 Q830 170 1000 210 L1000 620 Q830 580 600 640 Z" fill="#ffffff"/>
    <path d="M600 230 L600 640"/>
    <!-- prosta kolorowanka na lewej stronie: słońce -->
    <circle cx="370" cy="400" r="70"/>
    <path d="M370 290 L370 250 M370 510 L370 550 M260 400 L220 400 M480 400 L520 400
             M292 322 L264 294 M448 478 L476 506 M292 478 L264 506 M448 322 L476 294"/>
    <!-- prosta kolorowanka na prawej stronie: kwiatek -->
    <circle cx="800" cy="380" r="34"/>
    <circle cx="800" cy="318" r="30"/>
    <circle cx="862" cy="380" r="30"/>
    <circle cx="800" cy="442" r="30"/>
    <circle cx="738" cy="380" r="30"/>
    <path d="M800 472 L800 560 M800 530 Q850 500 880 520 Q850 550 800 530"/>
    <!-- strzałki: kartka wsuwa się pod stronę -->
    <path d="M1130 150 Q1000 110 900 170"/>
    <path d="M900 170 L940 128 M900 170 L955 182"/>
    <path d="M1170 720 Q1040 760 930 700"/>
    <path d="M930 700 L985 694 M930 700 L955 745"/>
  </g>
</svg>
